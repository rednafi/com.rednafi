<div class="command-palette" data-command-palette hidden>
  <div class="command-palette__backdrop" data-command-close aria-hidden="true"></div>
  <section
    id="command-palette"
    class="command-palette__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="command-palette-title"
  >
    <h2 id="command-palette-title" class="sr-only">Search and navigate</h2>
    <div class="command-palette__search">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        id="command-palette-input"
        class="command-palette__input"
        type="search"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="command-palette-results"
        aria-expanded="true"
        aria-label="Search titles, tags, and content"
        placeholder="Search titles, tags, and content…"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        enterkeyhint="go"
        spellcheck="false"
        data-command-input
      >
      <button class="command-palette__close" type="button" aria-label="Close search" data-command-close>
        <kbd>Esc</kbd>
        <svg class="command-palette__close-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="command-palette__body">
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-command-status></p>
      <p class="command-palette__group-label" data-command-group-label>Quick links</p>
      <div id="command-palette-results" class="command-palette__results" role="listbox" aria-label="Search results" data-command-results></div>
      <div class="command-palette__empty" data-command-empty hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <p>No results found</p>
        <span>Try a title, topic, or phrase from a post.</span>
      </div>
    </div>

  </section>

  <template data-command-quick-links>
    {{- $navigation := partial "navigation-data.html" . }}
    {{- range $navigation.quickLinks }}
    <a href="{{ .url }}" data-title="{{ .commandTitle | default .label }}" data-description="{{ .description }}" data-keywords="{{ .keywords }}"></a>
    {{- end }}
  </template>
</div>
