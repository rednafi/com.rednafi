site: public

# Index individual posts plus the evergreen pages exposed by the command palette.
# Section listing pages remain excluded because only these named roots are scanned.
glob: "{python,go,zephyr,misc,javascript,typescript,system,shards,about,blogroll,appearances}/**/*.html"

# Exclude metadata and navigation elements from indexing
exclude_selectors:
  - ".breadcrumbs"
  - ".post-meta"
  - ".post-tags"
  - ".toc"
  - ".related-posts"
